<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<title>Encouraging Todo</title>
<meta name="description" content="A todo list that feels like a supportive friend, not another nagging task manager.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="stats">
      <div class="stat">
        <span class="stat-num" id="doneTodayCount">0</span>
        <span class="stat-label">done today</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-num" id="streakCount">0</span>
        <span class="stat-label" id="streakLabel">day streak</span>
      </div>
    </div>
    <p class="tagline" id="tagline">one step at a time</p>
  </header>

  <main class="main">
    <form class="add-form" id="addForm" autocomplete="off">
      <input
        type="text"
        id="taskInput"
        name="task"
        placeholder="What's on your mind?"
        maxlength="200"
        aria-label="New task"
      >
      <button type="submit" class="add-btn" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <section aria-label="Active tasks">
      <ul class="task-list" id="activeList"></ul>
    </section>

    <p class="empty-state" id="emptyState">Nothing on the list. That's alright too.</p>

    <section class="done-section" id="doneSection" hidden>
      <button class="done-toggle" id="doneToggle" aria-expanded="false">
        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        <span id="doneToggleLabel">Completed</span>
      </button>
      <ul class="task-list done-list" id="doneList" hidden></ul>
    </section>
  </main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
