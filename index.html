<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<title>Encouraging Todo</title>
<meta name="description" content="A todo list that feels like a supportive friend, not another nagging task manager.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Encouraging">
<link rel="stylesheet" href="styles.css">
<script>
  // beforeinstallprompt can fire before app.js runs, and the event is the only
  // way to open the install dialog later. Stash it; app.js picks it up.
  window.__installPrompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; });
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-actions">
      <button class="icon-btn install-btn" id="installBtn" type="button" hidden aria-label="Install this app">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="3" x2="12" y2="15"></line><polyline points="7 10 12 15 17 10"></polyline><line x1="4" y1="20" x2="20" y2="20"></line></svg>
      </button>
      <button class="icon-btn" id="shareBtn" type="button" aria-label="Share your list">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line></svg>
      </button>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-num" id="doneTodayCount">0</span>
        <span class="stat-label">done today</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-num" id="streakCount">0</span>
        <span class="stat-label">day streak</span>
      </div>
    </div>
    <p class="tagline" id="tagline">one step at a time</p>
  </header>

  <div class="ios-install" id="iosInstall" hidden>
    <p class="ios-install-title">Keep this on your Home Screen</p>
    <ol class="ios-install-steps">
      <li>
        Tap
        <span class="ios-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><polyline points="8 7 12 3 16 7"></polyline><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></span>
        <span class="ios-step-label">Share</span> in Safari&#39;s toolbar
      </li>
      <li>Choose <strong>Add to Home Screen</strong></li>
    </ol>
    <button type="button" class="ios-install-dismiss" id="iosInstallDismiss">Got it</button>
  </div>

  <div class="import-banner" id="importBanner" hidden>
    <p id="importBannerText"></p>
    <div class="import-banner-actions">
      <button type="button" class="import-btn" id="importAddBtn">Add to my list</button>
      <button type="button" class="import-dismiss-btn" id="importDismissBtn">Dismiss</button>
    </div>
  </div>

  <main class="main">
    <form class="add-form" id="addForm" autocomplete="off">
      <input
        type="text"
        id="taskInput"
        name="task"
        placeholder="What's on your mind?"
        maxlength="200"
        aria-label="New task"
        enterkeyhint="done"
      >
      <button type="submit" class="add-btn" id="addBtn" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <section aria-label="Active tasks">
      <ul class="task-list" id="activeList"></ul>
    </section>

    <p class="empty-state" id="emptyState">Nothing on the list. That's alright too.</p>

    <section class="done-section" id="doneSection" hidden aria-label="Completed tasks">
      <div class="done-header">
        <button class="done-toggle" id="doneToggle" type="button" aria-expanded="false" aria-controls="doneList">
          <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
          <span id="doneToggleLabel">Completed</span>
        </button>
        <button class="clear-done-btn" id="clearDoneBtn" type="button" hidden>Clear</button>
      </div>
      <ul class="task-list done-list" id="doneList" hidden></ul>
    </section>
  </main>

</div>

<div class="cheer" id="cheer" role="status" aria-live="polite"></div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <span id="snackbarText"></span>
  <button type="button" class="snackbar-action" id="snackbarAction" hidden></button>
</div>

<script src="app.js"></script>
</body>
</html>
